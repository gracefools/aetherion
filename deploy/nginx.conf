# Reverse proxy with TLS in front of the game server. NOT VERIFIED here (no nginx in the build sandbox).
# Run the server with HOST=127.0.0.1 and TRUST_PROXY=1 so rate limits see the real client address.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 443 ssl http2;
  server_name play.example.com;
  ssl_certificate     /etc/letsencrypt/live/play.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/play.example.com/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000" always;
  client_max_body_size 16k;

  location /ws {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;                      # the server compares Origin with Host
    proxy_set_header X-Forwarded-For $remote_addr;    # replace, never append: the client cannot forge it
    proxy_read_timeout 120s;
  }
  location /api/metrics { deny all; }                 # scrape it from the machine itself
  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
}
server { listen 80; server_name play.example.com; return 301 https://$host$request_uri; }
