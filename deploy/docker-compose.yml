# NOT VERIFIED: no Docker daemon was available where this project was built (see docs/deploy.md).
# Usage: POSTGRES_PASSWORD=... METRICS_TOKEN=... docker compose -f deploy/docker-compose.yml up --build
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: aetherion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: aetherion
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aetherion"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
  game:
    build: { context: .., dockerfile: deploy/Dockerfile }
    environment:
      DATABASE_URL: postgres://aetherion:${POSTGRES_PASSWORD}@postgres:5432/aetherion
      REDIS_URL: redis://redis:6379
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN}
      # set to 1 when a reverse proxy (deploy/nginx.conf) sits in front
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # T4: account usernames with moderation rights (/ban, /mute, /kick, /audit), comma separated
      ADMIN_USERS: ${ADMIN_USERS:-}
    ports: ["8080:8080"]
    stop_grace_period: 30s   # SIGTERM saves every player before exit
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
  # Optional public address through a Cloudflare Tunnel (see deploy/CLOUDFLARE.md, option C):
  #   docker compose -f deploy/docker-compose.yml --profile tunnel up -d   (needs CF_TUNNEL_TOKEN in deploy/.env)
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
    depends_on: [game]
    restart: unless-stopped
  backup:
    image: postgres:16
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_EVERY_HOURS: ${BACKUP_EVERY_HOURS:-6}
      BACKUP_KEEP: ${BACKUP_KEEP:-28}
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - ./backups:/backups
    # tr strips Windows line endings in case the checkout converted them
    entrypoint: ["sh", "-c", "tr -d '\r' < /backup.sh > /tmp/b.sh && exec sh /tmp/b.sh"]
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
volumes:
  pgdata:
